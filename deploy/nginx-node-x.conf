# Install as a separate site. Check existing server_name entries before enabling.
# First issuance: enable only the port-80 block until the certificate exists.
server {
    listen 80;
    server_name xai.chuhai7.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* ^/operator(?:/|$) {
        return 404;
    }

    location / {
        return 301 https://xai.chuhai7.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name xai.chuhai7.com;

    ssl_certificate /etc/letsencrypt/live/xai.chuhai7.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xai.chuhai7.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NodeXSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    # The operator listener on 127.0.0.1:4174 is reachable only through SSH.
    location ~* ^/operator(?:/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host xai.chuhai7.com;
        proxy_set_header X-Forwarded-Host xai.chuhai7.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_redirect off;
    }
}
