version: "2.4"

services:
  postgres:
    image: postgres:16-bookworm@sha256:ce3efec6bc404f6b15ebf5d9bed6b45a9d4655aea238d7dacc3467ccb05a1175
    restart: unless-stopped
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - "${NODEX_DM_DATA_DIR:-/var/lib/nodex-dm}/postgres:/var/lib/postgresql/data"
      - "${NODEX_DM_DATA_DIR:-/var/lib/nodex-dm}/secrets/postgres-password:/run/secrets/postgres-password:ro"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "synapse", "-d", "synapse"]
      interval: 5s
      timeout: 3s
      retries: 18
    networks: [database]

  synapse:
    image: ghcr.io/element-hq/synapse:v1.165.0@sha256:673b4223c81a7634fd07d832b939a58f97081cfdaae7cdd2d1664cdcf7611b62
    restart: unless-stopped
    user: "991:991"
    ports: ["127.0.0.1:18008:8008"]
    volumes:
      - "${NODEX_DM_DATA_DIR:-/var/lib/nodex-dm}/synapse:/data"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8008/health"]
      interval: 5s
      timeout: 3s
      retries: 18
    depends_on:
      postgres:
        condition: service_healthy
    networks: [matrix, database]

  twitter:
    image: dock.mau.dev/mautrix/twitter:2efd3a5da34d459f2a75b5140f96b99f41582766-amd64@sha256:68620c2ea9dd1b131e3d933beb5d29f1fc35d7eb6302c9cd16696c848ec2aae2
    platform: linux/amd64
    restart: unless-stopped
    user: "1337:1337"
    working_dir: /data
    entrypoint: ["/bin/sh", "/opt/nodex/start-twitter.sh"]
    ports: ["127.0.0.1:19327:29327"]
    volumes:
      - "${NODEX_DM_DATA_DIR:-/var/lib/nodex-dm}/twitter:/data"
      - "./start-twitter.sh:/opt/nodex/start-twitter.sh:ro"
    depends_on:
      synapse:
        condition: service_healthy
    networks: [matrix]

networks:
  matrix:
  database:
    internal: true
